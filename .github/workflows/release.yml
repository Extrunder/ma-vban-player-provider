name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from pyproject.toml (for example 0.2.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --group dev
      - name: Check version and repository metadata
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: uv run python scripts/package_community.py --check-publication --version "$RELEASE_VERSION"
      - name: Publish a normal GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$RELEASE_VERSION" "dist/vban-community-$RELEASE_VERSION.zip" \
            --target "$GITHUB_SHA" --title "VBAN Player $RELEASE_VERSION" --generate-notes
