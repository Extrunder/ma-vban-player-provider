[project]
name = "ma-vban-player"
version = "0.2.0"
description = "VBAN audio player community provider for Music Assistant"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "music-assistant-models==1.1.205",
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.3,<2",
    "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [".reference", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

